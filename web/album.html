<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Álbum compartido · Revela</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="config.js"></script>
<style>
  :root {
    --fondo: #121010; --panel: #1c1817; --borde: #2e2826; --texto: #efe8e4; --suave: #a3958f;
    --acento: #e5533d; --acento-2: #f2a65a; --radio: 14px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--fondo); color: var(--texto); font: 15px/1.5 Inter, system-ui, sans-serif; }
  button { font: inherit; color: inherit; cursor: pointer; }
  header { padding: 28px 20px 8px; max-width: 1280px; margin: 0 auto; }
  .marca { font: 600 18px Fraunces, serif; color: var(--suave); }
  .marca span { color: var(--acento); }
  h1 { font: 600 34px Fraunces, serif; margin: 4px 0 2px; word-break: break-word; }
  .sub { color: var(--suave); margin: 0; }
  main { max-width: 1280px; margin: 0 auto; padding: 18px 20px 60px; }
  .grilla { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
  .foto { aspect-ratio: 1; border-radius: var(--radio); overflow: hidden; background: var(--panel); border: 1px solid var(--borde); padding: 0; }
  .foto img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .3s; }
  .foto:hover img { transform: scale(1.04); }
  .mensaje { text-align: center; padding: 80px 20px; color: var(--suave); border: 2px dashed var(--borde); border-radius: var(--radio); }
  dialog { background: #000; border: 0; padding: 0; max-width: 96vw; max-height: 96vh; border-radius: var(--radio); color: var(--texto); }
  dialog::backdrop { background: rgba(0,0,0,.88); }
  dialog img { display: block; max-width: 96vw; max-height: 86vh; object-fit: contain; }
  dialog p { margin: 0; padding: 10px 14px; background: var(--panel); font-size: 14px; }
  dialog p:empty { display: none; }
  .nav { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,.55); border: 0; border-radius: 50%;
         width: 44px; height: 44px; font-size: 22px; }
  .nav.ant { left: 8px; } .nav.sig { right: 8px; }
  @media (max-width: 640px) {
    header { padding: 20px 14px 4px; } h1 { font-size: 26px; }
    main { padding: 12px 6px 60px; }
    .grilla { grid-template-columns: repeat(3, 1fr); gap: 3px; }
    .foto { border-radius: 4px; border: 0; }
  }
</style>
</head>
<body>
<header>
  <div class="marca">Revel<span>a</span> · álbum compartido</div>
  <h1 id="nombre">Cargando…</h1>
  <p class="sub" id="sub"></p>
</header>
<main>
  <div class="grilla" id="grilla"></div>
  <p class="mensaje" id="mensaje" hidden></p>
</main>
<dialog id="visor" aria-label="Foto">
  <img id="v-img" alt="">
  <p id="v-texto"></p>
  <button class="nav ant" id="v-ant" aria-label="Anterior">‹</button>
  <button class="nav sig" id="v-sig" aria-label="Siguiente">›</button>
</dialog>
<script src="album.js"></script>
</body>
</html>
