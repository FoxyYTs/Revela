<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Revela</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.css"
      integrity="sha512-6AYkNPc8EvA9WwC0CvbRQHWpK1zV1+QeW+lVBfYqN2zTfG9IfWMRMyUDOw6GdF5US0poI/C/pz8tkiL+nfmYHg==" crossorigin="anonymous">
<script src="config.js"></script>
<style>
  :root {
    --fondo: #121010; --panel: #1c1817; --borde: #2e2826; --texto: #efe8e4; --suave: #a3958f;
    --acento: #e5533d; --acento-2: #f2a65a; --ok: #7bc47f; --radio: 14px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--fondo); color: var(--texto); font: 15px/1.5 Inter, system-ui, sans-serif; }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  .oculto { display: none !important; }

  header { position: sticky; top: 0; z-index: 5; display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
           padding: 14px 20px; background: rgba(18,16,16,.92); backdrop-filter: blur(8px); border-bottom: 1px solid var(--borde); }
  .logo { font: 600 26px Fraunces, serif; letter-spacing: .5px; margin-right: auto; }
  .logo span { color: var(--acento); }
  .buscar { flex: 1 1 260px; max-width: 460px; display: flex; background: var(--panel); border: 1px solid var(--borde); border-radius: 999px; }
  .buscar input { flex: 1; background: none; border: 0; padding: 9px 16px; outline: none; min-width: 0; }
  .buscar:focus-within { border-color: var(--acento-2); }
  .btn { background: var(--panel); border: 1px solid var(--borde); border-radius: 999px; padding: 8px 16px; }
  .btn:hover { border-color: var(--suave); }
  .btn.primario { background: var(--acento); border-color: var(--acento); color: #fff; font-weight: 600; }
  .btn.primario:hover { filter: brightness(1.1); }
  .btn:disabled { opacity: .5; cursor: default; }

  main { max-width: 1280px; margin: 0 auto; padding: 18px 20px 60px; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .chip { background: var(--panel); border: 1px solid var(--borde); border-radius: 999px; padding: 4px 12px; font-size: 13px; color: var(--suave); }
  button.chip:hover, .chip.activo { color: var(--texto); border-color: var(--acento-2); }
  .chip b { color: var(--texto); font-weight: 500; }

  .estado-busqueda { color: var(--suave); margin: 0 0 12px; }
  .grilla { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
  .foto { position: relative; aspect-ratio: 1; border-radius: var(--radio); overflow: hidden; background: var(--panel);
          border: 1px solid var(--borde); padding: 0; }
  .foto img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .3s; }
  .foto:hover img { transform: scale(1.04); }
  .foto .pie { position: absolute; inset: auto 0 0 0; padding: 22px 10px 8px; font-size: 12px; text-align: left;
               background: linear-gradient(transparent, rgba(0,0,0,.75)); color: #fff; }
  .foto .aviso { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 12px;
                 color: var(--suave); font-size: 13px; }
  .revelando { background: radial-gradient(circle at 50% 50%, rgba(229,83,61,.25), transparent 70%); animation: latido 1.6s ease-in-out infinite; }
  @keyframes latido { 50% { opacity: .45; } }

  .vacio { text-align: center; padding: 80px 20px; color: var(--suave); border: 2px dashed var(--borde); border-radius: var(--radio); }
  .vacio h2 { font: 600 28px Fraunces, serif; color: var(--texto); margin: 0 0 8px; }
  .soltar { outline: 3px dashed var(--acento-2); outline-offset: -12px; }
  .mas { display: block; margin: 24px auto 0; }
  .btn.activo { border-color: var(--acento-2); color: var(--acento-2); }
  .ubicacion { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--suave); cursor: pointer; }
  .ubicacion input { accent-color: var(--acento); }

  #vista-mapa { position: relative; height: calc(100vh - 140px); min-height: 360px; border-radius: var(--radio);
                overflow: hidden; border: 1px solid var(--borde); }
  #mapa { position: absolute; inset: 0; }
  .mapa-aviso { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 20px;
                color: var(--suave); pointer-events: none; }
  .marcador { width: 46px; height: 46px; border-radius: 50%; border: 3px solid var(--acento); padding: 0; overflow: hidden;
              background: var(--panel); box-shadow: 0 4px 14px rgba(0,0,0,.5); cursor: pointer; }
  .marcador.aproximada { border-style: dashed; border-color: var(--acento-2); }
  .marcador img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .marcador:hover, .marcador:focus-visible { transform: scale(1.12); }
  .maplibregl-ctrl-attrib { font-size: 10px; }

  .subidas { position: fixed; right: 16px; bottom: 16px; width: min(340px, calc(100vw - 32px)); z-index: 6;
             background: var(--panel); border: 1px solid var(--borde); border-radius: var(--radio); padding: 12px 14px; font-size: 13px; }
  .subidas div { display: flex; justify-content: space-between; gap: 8px; padding: 3px 0; }
  .subidas span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  dialog { background: var(--panel); color: var(--texto); border: 1px solid var(--borde); border-radius: var(--radio);
           padding: 0; max-width: min(1100px, 96vw); width: 100%; }
  dialog::backdrop { background: rgba(0,0,0,.8); }
  .detalle { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(260px, 1fr); }
  .detalle img { width: 100%; max-height: 80vh; object-fit: contain; background: #000; display: block; }
  .info { padding: 20px; display: flex; flex-direction: column; gap: 14px; overflow-y: auto; max-height: 80vh; }
  .info h3 { margin: 0; font: 600 20px Fraunces, serif; word-break: break-word; }
  .descripcion { margin: -6px 0 0; color: var(--texto); font-size: 15px; line-height: 1.55; }
  .descripcion:empty { display: none; }
  .info dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 14px; }
  .info dt { color: var(--suave); }
  .info pre { white-space: pre-wrap; margin: 0; font: 13px/1.4 ui-monospace, monospace; background: var(--fondo); padding: 10px; border-radius: 8px; }
  .info a { color: var(--acento-2); }
  .acciones { display: flex; gap: 8px; margin-top: auto; }
  .peligro { color: #ff8b7a; }
  @media (max-width: 760px) { .detalle { grid-template-columns: 1fr; } .info { max-height: none; } }
  /* Celular: encabezado compacto que no se queda fijo y galería de 3 columnas */
  @media (max-width: 640px) {
    header { position: static; padding: 12px 14px; gap: 8px; }
    .logo { font-size: 22px; }
    .buscar { order: 9; flex-basis: 100%; max-width: none; }
    .btn { padding: 7px 12px; font-size: 14px; }
    main { padding: 12px 6px 60px; }
    .chips { padding: 0 8px; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
    .chip { flex: none; }
    .grilla { grid-template-columns: repeat(3, 1fr); gap: 3px; }
    .foto { border-radius: 4px; border: 0; }
    .foto .pie { display: none; }
    .foto .aviso { font-size: 11px; padding: 4px; }
    #vista-mapa { height: calc(100vh - 150px); border-radius: 8px; }
    dialog { max-width: 100vw; max-height: 100dvh; margin: auto 0 0; border-radius: 14px 14px 0 0; }
  }

  .acceso { min-height: 100vh; display: grid; place-items: center; padding: 20px;
            background: radial-gradient(ellipse at top, rgba(229,83,61,.18), transparent 60%); }
  .tarjeta { width: min(380px, 100%); background: var(--panel); border: 1px solid var(--borde); border-radius: 20px; padding: 28px; }
  .tarjeta .logo { font-size: 40px; text-align: center; margin: 0 0 4px; }
  .tarjeta p.lema { text-align: center; color: var(--suave); margin: 0 0 22px; }
  .tarjeta form { display: flex; flex-direction: column; gap: 10px; }
  .tarjeta input { background: var(--fondo); border: 1px solid var(--borde); border-radius: 10px; padding: 11px 14px; }
  .tarjeta input:focus { outline: none; border-color: var(--acento-2); }
  .tarjeta .enlace { background: none; border: 0; color: var(--acento-2); padding: 6px; }
  .mensaje { min-height: 1.5em; font-size: 14px; color: var(--acento-2); text-align: center; margin: 4px 0 0; }
</style>
</head>
<body>

<section id="acceso" class="acceso oculto">
  <div class="tarjeta">
    <h1 class="logo">Revel<span>a</span></h1>
    <p class="lema">Tus fotos, entendidas solas.</p>
    <form id="form-entrar">
      <input name="correo" type="email" placeholder="Correo" autocomplete="email" required>
      <input name="clave" type="password" placeholder="Contraseña" autocomplete="current-password" required>
      <button class="btn primario">Entrar</button>
      <button type="button" class="enlace" data-ir="registro">¿No tienes cuenta? Regístrate</button>
    </form>
    <form id="form-registro" class="oculto">
      <input name="correo" type="email" placeholder="Correo" autocomplete="email" required>
      <input name="clave" type="password" placeholder="Contraseña (8+, con letras y números)" autocomplete="new-password" minlength="8" required>
      <button class="btn primario">Crear cuenta</button>
      <button type="button" class="enlace" data-ir="entrar">Ya tengo cuenta</button>
    </form>
    <form id="form-confirmar" class="oculto">
      <input name="codigo" inputmode="numeric" placeholder="Código que llegó a tu correo" autocomplete="one-time-code" required>
      <button class="btn primario">Confirmar</button>
      <button type="button" class="enlace" data-ir="entrar">Volver</button>
    </form>
    <p class="mensaje" id="mensaje" role="status"></p>
  </div>
</section>

<div id="app" class="oculto">
  <header>
    <div class="logo">Revel<span>a</span></div>
    <form class="buscar" id="form-buscar" role="search">
      <input id="q" type="search" placeholder="Buscar: perro, playa, cumpleaños, texto de un letrero…" aria-label="Buscar fotos">
    </form>
    <button class="btn" id="btn-mapa" aria-pressed="false">🗺️ Mapa</button>
    <label class="ubicacion" title="Si la foto no trae GPS (los celulares lo borran al compartir), se guarda dónde estabas al subirla">
      <input type="checkbox" id="usar-ubicacion"> Mi ubicación
    </label>
    <button class="btn primario" id="btn-subir">Subir fotos</button>
    <button class="btn" id="btn-salir">Salir</button>
    <input id="archivos" type="file" accept="image/jpeg,image/png" multiple hidden>
  </header>
  <main id="zona">
    <div id="vista-galeria">
    <div class="chips" id="chips"></div>
    <p class="estado-busqueda oculto" id="estado-busqueda"></p>
    <div class="grilla" id="grilla"></div>
    <div class="vacio oculto" id="vacio">
      <h2>Aún no hay fotos</h2>
      <p>Arrastra fotos aquí o usa <b>Subir fotos</b>. Revela las etiqueta, lee su texto y las ordena por fecha.</p>
    </div>
    <button class="btn mas oculto" id="btn-mas">Cargar más</button>
    </div>
    <div id="vista-mapa" class="oculto">
      <div id="mapa" role="region" aria-label="Mapa de tus fotos"></div>
      <p class="mapa-aviso oculto" id="mapa-aviso"></p>
    </div>
  </main>
  <div class="subidas oculto" id="subidas" aria-live="polite"></div>
</div>

<dialog id="dialogo">
  <div class="detalle">
    <img id="d-img" alt="">
    <div class="info">
      <h3 id="d-nombre"></h3>
      <p id="d-descripcion" class="descripcion"></p>
      <div class="chips" id="d-etiquetas"></div>
      <dl id="d-datos"></dl>
      <div id="d-texto"></div>
      <div class="acciones">
        <button class="btn peligro" id="d-borrar">Borrar</button>
        <button class="btn" id="d-cerrar" autofocus>Cerrar</button>
      </div>
    </div>
  </div>
</dialog>

<script src="app.js"></script>
</body>
</html>
